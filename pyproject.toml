[project]
name = "rubiks-cube-ai-toolkit"
version = "0.2.0"
description = "Deterministic Rubik's Cube primitives for reliable AI agent tools"
readme = "README.md"
authors = [
    { name = "Aswin1988", email = "24779441+Aswin1988@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []
license = "MIT"
keywords = ["rubiks-cube", "ai-agents", "mcp", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/Aswin1988/rubiks-cube-ai-toolkit"
Repository = "https://github.com/Aswin1988/rubiks-cube-ai-toolkit"
Issues = "https://github.com/Aswin1988/rubiks-cube-ai-toolkit/issues"

[project.scripts]
cube-ai = "rubiks_cube_ai_toolkit.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=rubiks_cube_ai_toolkit",
    "--cov-report=term-missing",
    "--cov-branch",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["rubiks_cube_ai_toolkit"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
