name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.2"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev --extra solver
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv build
      - name: Smoke-test wheel installation
        run: >-
          uv run --isolated --no-project
          --refresh-package rubiks-cube-ai-toolkit
          --with ./dist/rubiks_cube_ai_toolkit-0.2.0-py3-none-any.whl
          python -c "import rubiks_cube_ai_toolkit as package; from rubiks_cube_ai_toolkit.verification import StickerState; assert package.__version__ == '0.2.0'; assert StickerState.solved().is_solved"
      - name: Smoke-test wheel solver extra
        run: >-
          uv run --isolated --no-project
          --with "./dist/rubiks_cube_ai_toolkit-0.2.0-py3-none-any.whl[solver]"
          python -c "import numpy, psutil, rubik_solver; from rubiks_cube_ai_toolkit.solvers import RubikSolverSubprocess; assert RubikSolverSubprocess.name == 'rubik-solver-py-0.1.1'"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.2"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --dev --extra solver
      - run: uv run pytest
